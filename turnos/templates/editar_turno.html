{% extends "base.html" %}

{% block title %}Editar turno{% endblock %}

{% block content %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/calendarios.css' %}">

<div class="edit-wrapper">

  <div class="edit-card">

    <h1 class="edit-title">✂️ Editar turno</h1>
    <p class="edit-subtitle">Modificá la información del turno</p>

    <form method="post" class="edit-form">
      {% csrf_token %}

      <div class="form-group">
        <label>{{ form.nombre.label }}</label>
        {{ form.nombre }}
      </div>

      <div class="form-group">
        <label>{{ form.desc.label }}</label>
        {{ form.desc }}
      </div>

      <div class="form-row">

        <div class="form-group">
          <label>{{ form.fecha.label }}</label>
          {{ form.fecha }}
        </div>

        <div class="form-group">
          <label>{{ form.hora.label }}</label>
          {{ form.hora }}
        </div>

      </div>

      <div class="form-group">
        <label>{{ form.sena.label }}</label>
        {{ form.sena }}
      </div>

      <div class="edit-actions">

        <button type="submit" class="btn-save">
          Guardar cambios
        </button>

        <a href="{% url 'turnos' %}" class="btn-back">
          ← Volver al calendario
        </a>

      </div>

    </form>

  </div>

</div>

{% endblock %}
