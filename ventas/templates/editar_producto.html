{% extends "base.html" %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/estilo_crear.css' %}">
<div class="container-form">
    <div class="card-carga">
        <h2>Editar: {{ producto.nombre }}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-enviar">Guardar Cambios</button>
            <a href="{% url 'lista_productos' %}" style="display:block; text-align:center; margin-top:10px;">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
